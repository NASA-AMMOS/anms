_meta:
  type: "rolesmapping"
  config_version: 2

all_access:
  reserved: false
  hidden: false
  backend_roles:
    - "admin"
  users:
    - "admin"
  hosts: []
  description: "Maps admin to all_access"

security_rest_api_access:
  reserved: false
  hidden: false
  backend_roles:
    - "admin"
  users:
    - "admin"
  hosts: []
  description: "Allows admin to use the Security REST API"

kibana_server:
  reserved: true
  hidden: false
  backend_roles: []
  users:
    - "kibanaserver"
  hosts: []
  description: "Maps kibanaserver to kibana_server"

anonymous_dashboard_viewer:
  reserved: false
  hidden: false
  backend_roles:
    - "opendistro_security_anonymous_backendrole"
  hosts: []
  users: []
  description: "Maps anonymous iframe users to read-only dashboard role"

kibana_read_only:
  reserved: false
  hidden: false
  backend_roles:
    - "opendistro_security_anonymous_backendrole"
  users: []
  hosts: []